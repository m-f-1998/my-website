<div id="contact" class="section-block px-4 pb-8">
  <app-section-heading
    eyebrow="Get in touch"
    title="Contact"
    subtitle="Opportunities, collaborations, or a copy of my CV — I'd love to hear from you."
  />
  <div class="card mb-0 contact-card">
    <div class="px-6 sm:px-8 py-6">
      @if (processing()) {
        <div class="status-banner status-banner-info">
          <fa-icon [icon]="iconSvc.getIcon('fas', 'spinner')" animation="spin" />
          Sending...
        </div>
      } @else if (success()) {
        <div class="status-banner status-banner-success">
          <fa-icon [icon]="iconSvc.getIcon('fas', 'check')" />
          {{ message() }}
        </div>
      } @else if (error()) {
        <div class="status-banner status-banner-error">
          <fa-icon [icon]="iconSvc.getIcon('fas', 'exclamation-triangle')" />
          {{ message() }}
        </div>
      } @else {
        <form [formGroup]="contactForm!" (submit)="sendEmail()">
          <div class="mb-4">
            <input
              class="w-full px-4 py-2.5 bg-gray-700 rounded-lg border border-gray-600 text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all"
              type="text" name="subject" placeholder="Subject" formControlName="subject"
            />
          </div>
          <div class="mb-4">
            <textarea
              class="w-full px-4 py-2.5 bg-gray-700 rounded-lg border border-gray-600 text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all min-h-[120px] resize-y"
              name="message" placeholder="Your message" formControlName="message"
            ></textarea>
          </div>
          <div>
            <button class="btn-primary w-full sm:w-auto" type="submit" [disabled]="!contactForm!.valid">Send message</button>
          </div>
          @if (showRecaptchaNotice) {
            <p class="text-xs text-gray-500 mt-4 leading-relaxed">
              Protected by reCAPTCHA —
              <a href="https://policies.google.com/privacy" target="_blank" rel="noopener" class="text-gray-400 hover:text-green-400">Privacy</a>
              &middot;
              <a href="https://policies.google.com/terms" target="_blank" rel="noopener" class="text-gray-400 hover:text-green-400">Terms</a>
            </p>
          }
        </form>
      }
    </div>
  </div>
</div>
